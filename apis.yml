aid: grove-collaborative
name: Grove Collaborative
description: >-
  Grove Collaborative is a digital-first consumer products company and online
  marketplace for sustainable everyday household essentials — eco-friendly
  cleaning supplies, bamboo and recycled paper products, personal care, beauty,
  pet, and vitamins & supplements from hundreds of vetted brands. Orders meet
  strict ingredient standards and are carbon neutral, and the company operates as
  a plastic-neutral, sustainability-focused retailer sold through grove.co (a
  Shopify-hosted storefront) and retail partners. Grove is a public benefit
  company (NYSE: GROV) that was an early portfolio company of 500 Global and
  Bullpen Capital. It publishes no first-party developer API or public developer
  program; this profile captures its public web, security, and Shopify-platform
  discovery surface.
